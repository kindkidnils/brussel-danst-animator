  /* ============================================================
     Color tokens — geswitcht via [data-theme="day"] / [data-theme="night"]
     en [data-mood="chillen"] etc. op de body
     ============================================================ */
  :root {
    /* Mood colors — vast */
    --mood-chillen: #12CBCE;
    --mood-dansen: #F95EFF;
    --mood-stampen: #FFF42D;
    --mood-raven: #52E02E;
    --bg-night: #3A0261;
    --bg-letter-night: #2B004A;
    --bg-letter-day: #FFFAD4;
    --stroke-day: #3A0261;
    --text-night: #FFFAD4;
    --text-day: #3A0261;
  }

  /* Active mood color exposed via custom prop op body */
  body[data-mood="chillen"]      { --mood-color: var(--mood-chillen); }
  body[data-mood="dansen"]  { --mood-color: var(--mood-dansen); }
  body[data-mood="stampen"]         { --mood-color: var(--mood-stampen); }
  body[data-mood="raven"]     { --mood-color: var(--mood-raven); }

  /* Theme: night */
  body[data-theme="night"] {
    --page-bg: var(--bg-night);
    --letter-bg: var(--bg-letter-night);
    --stroke-color: var(--mood-color);
    --text-color: var(--text-night);
    --ui-text: var(--text-night);
    --ui-accent: var(--mood-color);
  }
  /* Theme: day */
  body[data-theme="day"] {
    --page-bg: var(--mood-color);
    --letter-bg: var(--bg-letter-day);
    --stroke-color: var(--stroke-day);
    --text-color: var(--text-day);
    --ui-text: var(--text-day);
    --ui-accent: var(--text-day);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: 'Flanders Art Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: var(--page-bg);
    color: var(--ui-text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.5s ease, color 0.5s ease;
  }

  /* Logo placeholder linksboven — SVG icoon van Nils */
  .logo-slot {
    position: absolute;
    top: 24px;
    left: 28px;
    width: 64px;
    height: auto;
    z-index: 5;
  }
  .logo-slot svg {
    display: block;
    width: 100%;
    height: auto;
  }
  /* Mini-logo gebruikt dezelfde kleurlogica als hoofdlogo:
     bg-paths volgen letter-bg, stroke-paths de stroke-color */
  .logo-slot .icon-bg { fill: var(--letter-bg); transition: fill 0.5s ease; }
  .logo-slot .icon-stroke {
    stroke: var(--stroke-color);
    fill: none;
    transition: stroke 0.5s ease;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    /* Onder padding is groter zodat het logo niet onder de toolbox-bar komt */
    padding-bottom: 120px;
  }

  /* Stage: viewBox is 1873.5 x 1080 -> ratio ~ 1.735 */
  .stage {
    width: min(720px, 73.6vw);
    aspect-ratio: 1873.5 / 1080;
  }
  .stage svg {
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* SVG color application via CSS variables */
  .static-text { fill: var(--text-color); transition: fill 0.5s ease; }
  .letter-bg-shape { fill: var(--letter-bg); transition: fill 0.5s ease; }
  .stroke-path { stroke: var(--stroke-color); transition: stroke 0.5s ease; }

  /* ============================================================
     Toolbox-bar: vaste positie onderaan scherm, 3 aparte containers
     elk met label + controls binnen dezelfde witte box
     ============================================================ */
  .toolbox-bar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: stretch;
    flex-wrap: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    max-width: calc(100vw - 32px);
    padding: 8px;
    scrollbar-width: none;
    -ms-overflow-style: none;
    z-index: 10;
  }
  .toolbox-bar::-webkit-scrollbar {
    display: none;
  }

  /* Elke "stack" bevat label + controls in één witte box */
  .toolbox-stack {
    background: #FFFAD4;
    color: #3A0261;
    border-radius: 10px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
  }

  /* Label boven elke groep — binnen de witte box */
  .toolbox-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #3A0261;
    text-align: center;
    opacity: 0.65;
  }

  /* Gedeelde "track" voor mood-knoppen en dag/nacht toggle:
     subtiele paarse achtergrond zodat de actieve state als pill
     over de track lijkt te schuiven. */
  .toolbox-track {
    background: rgba(58, 2, 97, 0.08);
    border-radius: 10px;
    padding: 3px;
    display: flex;
    align-items: center;
    gap: 2px;
    height: 36px;             /* uniforme hoogte voor alle controls */
  }

  /* Mood picker — knoppen binnen de track */
  .mood-btn {
    background: transparent;
    border: none;
    color: #3A0261;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    padding: 0 12px;
    height: 100%;
    border-radius: 8px;
    opacity: 0.5;
    transition: opacity 0.2s, background 0.3s, color 0.3s;
    white-space: nowrap;
  }
  .mood-btn:hover { opacity: 0.85; }
  .mood-btn.active {
    opacity: 1;
    background: var(--mood-color);
    color: #3A0261;
  }

  /* Day/night toggle als slider met bolletje */
  .theme-toggle {
    position: relative;
    background: rgba(58, 2, 97, 0.08);
    border-radius: 999px;
    width: 60px;
    height: 36px;
    cursor: pointer;
    border: none;
    padding: 0;
    flex-shrink: 0;
  }
  /* Bolletje */
  .theme-toggle::before {
    content: "";
    position: absolute;
    top: 4px;
    left: 4px;
    width: 28px;
    height: 28px;
    background: #3A0261;
    border-radius: 50%;
    transition: transform 0.3s cubic-bezier(0.4, 0.0, 0.2, 1);
  }
  /* Dag = bolletje links, Nacht = bolletje rechts */
  body[data-theme="night"] .theme-toggle::before {
    transform: translateX(24px);
  }
  /* Iconen voor dag/nacht zijn tijdelijk verwijderd */

  /* Export — donkere container met cream stroke errond VOLLEDIGE BOX */
  .toolbox-stack.export-stack {
    background: #3A0261;
    border: 2px solid #FFFAD4;
    border-radius: 10px;
    padding: 6px 8px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .toolbox-stack.export-stack:hover {
    background: #FFFAD4;
  }
  .toolbox-stack.export-stack .toolbox-label {
    color: #FFFAD4;
    transition: color 0.2s;
  }
  .toolbox-stack.export-stack:hover .toolbox-label {
    color: #3A0261;
  }
  .export-group {
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .export-btn {
    background: transparent;
    color: #FFFAD4;
    border: none;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
    height: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
    pointer-events: none; /* hover afhandelen op parent stack */
  }
  .toolbox-stack.export-stack:hover .export-btn {
    color: #3A0261;
  }
  .export-btn .icon-slot {
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .export-btn .icon-slot svg {
    width: 100%;
    height: 100%;
  }
  /* Stroke-based icoon: stroke-width zelfde als border rondom box (2px scaled) */
  .export-btn .icon-slot svg .st0 {
    stroke: currentColor;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 5px; /* dikker, vergelijkbaar met de box-border */
  }

  /* Rechtsboven: TKK credit-link */
  .credit-link {
    position: absolute;
    top: 28px;
    right: 28px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ui-text);
    text-decoration: none;
    opacity: 0.6;
    transition: opacity 0.2s, color 0.5s ease;
    z-index: 5;
  }
  .credit-link:hover { opacity: 1; }

  @media (max-width: 720px) {
    main { padding-bottom: 140px; }
    .toolbox-bar {
      bottom: 16px;
      gap: 8px;
    }
    .toolbox-stack { padding: 6px 8px; }
    .toolbox-track { height: 32px; }
    .mood-btn { padding: 0 10px; font-size: 12px; }
    .theme-toggle { width: 54px; height: 32px; }
    .theme-toggle::before { width: 24px; height: 24px; }
    body[data-theme="night"] .theme-toggle::before { transform: translateX(22px); }
    .export-group { height: 32px; }
    .toolbox-label { font-size: 9px; }
    .logo-slot { top: 12px; left: 16px; width: 44px; }
    .credit-link { top: 18px; right: 16px; font-size: 10px; }
  }
</style>
</head>

<script>
// ============================================================
// Letters — alle 12 letters met cx/cy in nieuwe viewBox (1873.5 x 1080)
// BRUSSEL: B-R-U-S1-S2-E-L  (index 0-6)
// DANST: D-A-N-S-T          (index 7-11)
//
// `column` koppelt BRUSSEL en DANST letters die boven elkaar staan,
// zodat ze synchroon bewegen en niet kunnen overlappen.
//   col 0: B (alleen)
//   col 1: R + D
//   col 2: U + A
//   col 3: S1 + N
//   col 4: S2 + S
//   col 5: E + T
//   col 6: L (alleen)
// ============================================================
const letters = [
  // BRUSSEL
  { id: 'letter-B',  cx: 122,  cy: 400, index: 0,  column: 0 },
  { id: 'letter-R',  cx: 406,  cy: 378, index: 1,  column: 1 },
  { id: 'letter-U',  cx: 691,  cy: 353, index: 2,  column: 2 },
  { id: 'letter-S1', cx: 976,  cy: 340, index: 3,  column: 3 },
  { id: 'letter-S2', cx: 1257, cy: 339, index: 4,  column: 4 },
  { id: 'letter-E',  cx: 1535, cy: 374, index: 5,  column: 5 },
  { id: 'letter-L',  cx: 1774, cy: 398, index: 6,  column: 6 },
  // DANST
  { id: 'letter-D',  cx: 353,  cy: 697, index: 7,  column: 1 },
  { id: 'letter-A',  cx: 639,  cy: 754, index: 8,  column: 2 },
  { id: 'letter-N',  cx: 937,  cy: 752, index: 9,  column: 3 },
  { id: 'letter-S',  cx: 1242, cy: 750, index: 10, column: 4 },
  { id: 'letter-T',  cx: 1509, cy: 691, index: 11, column: 5 },
];

const letterEls = letters.map(l => {
  const group = document.getElementById(l.id);
  const strokeWrap = group.querySelector('.stroke-wrap');
  const strokePath = group.querySelector('.stroke-path');
  const bgShape = group.querySelector('.letter-bg-shape');
  const pathLength = strokePath.getTotalLength();
  return { ...l, group, strokeWrap, strokePath, bgShape, pathLength };
});

const turbEl = document.getElementById('raven-turb');
const dispEl = document.getElementById('raven-disp');

// Base stroke-width matchend aan SVG
const BASE_STROKE_WIDTH = 13.46;

// Schaal: viewBox is nu 1873.5 breed. v5 was 290 breed.
// Verhouding: ~6.46. Maar pixelbewegingen voelen niet altijd 1:1 lineair op grote canvas.
// We schalen amplitudes met factor 6 als startpunt.
const SCALE = 6;

function resetStroke() {
  for (const l of letterEls) {
    l.strokePath.removeAttribute('stroke-dasharray');
    l.strokePath.removeAttribute('stroke-dashoffset');
    l.strokePath.style.strokeWidth = '';
    l.strokePath.removeAttribute('filter');
    // Transforms ook resetten — anders kan een vorige mood-transform
    // blijven hangen op group/bg/stroke-wrap.
    l.group.removeAttribute('transform');
    l.bgShape.removeAttribute('transform');
    l.strokeWrap.removeAttribute('transform');
  }
  dispEl.setAttribute('scale', '0');
}

// ============================================================
// Moods — alle 12 letters delen dezelfde recipe.
// Phase wordt gestuurd door letter.index (0-11) zodat de hele zin
// als een golf voelt, met BRUSSEL boven en DANST eronder synchroon.
// ============================================================
const moods = {
  chillen: {
    transform: (letter, t) => {
      // Rustige sinus-loop: letters wiegen chill, stroke beweegt nauwelijks
      // ten opzichte van de bg-vorm.
      const T = 12;
      const w = (2 * Math.PI) / T;  // 1 cyclus per 12s = traag wiegen
      const phase = letter.column * 1.4;

      return {
        // Letters wiegen rustig op en neer
        groupTy: Math.sin(w * t + phase) * 2.5 * SCALE,
        // Stroke beweegt minimaal ten opzichte van letter
        // (alle stroke-* waarden klein zodat hij dicht bij de bg blijft)
        strokeRot: Math.sin(w * t + phase) * 0.4,
        strokeTx: Math.sin(w * t + phase) * 0.25 * SCALE,
        strokeTy: Math.cos(w * t + phase) * 0.25 * SCALE,
        strokeSkew: 0,
      };
    },
    stroke: (letter, t) => {
      const T = 12;
      const L = letter.pathLength;
      // Pattern-lengte = 0.2 × L (zelfde als de dashoffset shift per cyclus).
      // Daardoor schuift het patroon na T precies 1 hele patroon-eenheid op
      // → visueel identiek aan startpositie → naadloze loop.
      // Streepjes ratio: ~93% zichtbaar / ~7% gat (vergelijkbaar met voorheen).
      letter.strokePath.setAttribute('stroke-dasharray', `${L * 0.186} ${L * 0.014}`);
      const offset = -((t / T) * L * 0.2 + letter.index * 7) % L;
      letter.strokePath.setAttribute('stroke-dashoffset', offset.toFixed(2));
    },
  },

  dansen: {
    transform: (letter, t) => {
      const bpm = 90;
      // walsT loopt 0 → 1 binnen één wals (3 beats = 2 seconden)
      const walsT = (t * bpm / 60 / 3) % 1;

      // Driekwartsmaat: BOEM - tik - zweef
      // Beat 1 (0.00 - 0.33): grote stuiter
      // Beat 2 (0.33 - 0.66): kleine stuiter
      // Beat 3 (0.66 - 1.00): zachte opwaartse aanloop
      let bounce = 0;
      let beatStrength = 0;  // gebruikt voor rotatie + stroke-width

      if (walsT < 0.33) {
        // Beat 1 — grote aanslag
        const localT = walsT / 0.33;
        bounce = Math.sin(localT * Math.PI) * 1.0;
        beatStrength = Math.sin(localT * Math.PI) * 1.0;
      } else if (walsT < 0.66) {
        // Beat 2 — kleine secundaire stuiter
        const localT = (walsT - 0.33) / 0.33;
        bounce = Math.sin(localT * Math.PI) * 0.3;
        beatStrength = Math.sin(localT * Math.PI) * 0.4;
      } else {
        // Beat 3 — zachte opwaartse zweef richting volgende beat 1
        // Niet stuiteren maar geleidelijk omhoog en weer terug, voelt
        // als "aanloop nemen" voor de volgende boem.
        const localT = (walsT - 0.66) / 0.34;
        // Halve sinus die piekt rond 60% en daarna terug zakt naar 0
        bounce = Math.sin(localT * Math.PI) * 0.2;
        beatStrength = 0;  // geen rotatie/width pulse op beat 3
      }

      const heightVariation = 0.7 + 0.3 * Math.sin(letter.column * 1.7);

      return {
        groupTy: -bounce * 18 * SCALE * heightVariation,
        strokeRot: beatStrength * Math.sin(letter.column * 2.3) * 3,
        strokeTx: 0,
        strokeTy: 0,
        strokeSkew: 0,
      };
    },
    stroke: (letter, t) => {
      const bpm = 90;
      const walsT = (t * bpm / 60 / 3) % 1;

      // Stroke-width volgt dezelfde driedeling als de transform
      let widthBoost = 0;
      if (walsT < 0.33) {
        // Beat 1 — sterke ademing
        const localT = walsT / 0.33;
        widthBoost = Math.sin(localT * Math.PI) * 0.5;
      } else if (walsT < 0.66) {
        // Beat 2 — lichte ademing
        const localT = (walsT - 0.33) / 0.33;
        widthBoost = Math.sin(localT * Math.PI) * 0.2;
      }
      // Beat 3 — geen pulse, stroke blijft op rust

      letter.strokePath.style.strokeWidth = (BASE_STROKE_WIDTH * (1 + widthBoost)).toFixed(2) + 'px';
    },
  },

  stampen: {
    transform: (letter, t) => {
      const bpm = 124;
      // beatT loopt 0 → 1 binnen één 4/4 beat (~0.48s)
      const beatT = (t * bpm / 60) % 1;

      // Stuiter-envelope: snelle hop in eerste 60%, daarna rust.
      // Zelfde sinus-boog als Guinguette maar binnen kortere window.
      let bounce = 0;
      if (beatT < 0.6) {
        const localT = beatT / 0.6;
        bounce = Math.sin(localT * Math.PI);
      }

      // Hoogte-variatie per kolom — subtieler dan Guinguette want
      // we willen meer eenheid van energie op de dansvloer.
      const heightVariation = 0.85 + 0.15 * Math.sin(letter.column * 1.7);

      return {
        groupTy: -bounce * 16 * SCALE * heightVariation,
        // Iets meer rotatie dan Guinguette omdat de energie hoger is
        strokeRot: bounce * Math.sin(letter.column * 2.3) * 5,
        strokeTx: 0,
        strokeTy: 0,
        strokeSkew: 0,
      };
    },
    stroke: (letter, t) => {
      const bpm = 124;
      const beatT = (t * bpm / 60) % 1;

      // Pulse-envelope: scherpe attack in eerste 30%, dan exponentiële decay.
      // Geeft die "punch" op de beat — anders gevormd dan de stuiter.
      let pulse = 0;
      if (beatT < 0.3) {
        const localT = beatT / 0.3;
        pulse = Math.pow(1 - localT, 2);  // start op 1, decay naar 0
      }

      // Stroke-width punch: van basisbreedte naar +130% bij elke aanslag
      letter.strokePath.style.strokeWidth = (BASE_STROKE_WIDTH * (1 + pulse * 1.3)).toFixed(2) + 'px';

      // Dash-pulse: stroke breekt in korte streepjes tijdens de attack,
      // herstelt naar doorlopend tijdens de rest. Dit was het strobo-effect
      // van eerder, maar nu beat-synchroon.
      const L = letter.pathLength;
      if (pulse > 0.4) {
        const dashOn = L * (0.05 + pulse * 0.1);
        const dashOff = L * 0.02 * pulse;
        letter.strokePath.setAttribute('stroke-dasharray', `${dashOn} ${dashOff}`);
        letter.strokePath.setAttribute('stroke-dashoffset', '0');
      } else {
        letter.strokePath.removeAttribute('stroke-dasharray');
      }
    },
  },

  raven: {
    transform: (letter, t) => {
      // Loop-periode T = 4 seconden. Alle frequenties zijn gehele veelvouden
      // van 2π/T zodat na 4s alles terug op start staat. Voor "chaos" gebruik
      // ik per as verschillende veelvouden en per letter een offset op die
      // veelvouden. Resultaat: rommelig én exact periodiek na T.
      const T = 4;
      const w = (2 * Math.PI) / T;
      const n1 = 5 + (letter.index % 4);
      const n2 = 7 + (letter.index % 5);
      const n3 = 11 + (letter.index % 3);
      return {
        groupTy: (Math.sin(w * n1 * t) * 7 + Math.sin(w * n2 * t) * 4) * SCALE,
        strokeRot: Math.sin(w * n2 * t) * 9 + Math.sin(w * n3 * t) * 4,
        // X-translatie verlaagd: ~50% terug, zodat letters dichter bij hun
        // plek blijven en het woord leesbaar blijft.
        strokeTx: (Math.sin(w * n1 * t) * 2.5 + Math.cos(w * n3 * t) * 1.5) * SCALE,
        strokeTy: Math.cos(w * n2 * t) * 3.5 * SCALE,
        // Skew iets minder — die trekt letters horizontaal uit
        strokeSkew: Math.sin(w * n1 * t) * 2.5,
      };
    },
    stroke: (letter, t) => {
      const T = 4;
      const w = (2 * Math.PI) / T;
      const L = letter.pathLength;
      const a = 6 + Math.abs(Math.sin(w * 6 * t + letter.index)) * 20;
      const b = 4 + Math.abs(Math.cos(w * 9 * t + letter.index * 1.7)) * 12;
      const c = 10 + Math.abs(Math.sin(w * 5 * t + letter.index * 0.8)) * 8;
      letter.strokePath.setAttribute('stroke-dasharray', `${a.toFixed(1)} ${b.toFixed(1)} ${c.toFixed(1)} ${(b*0.7).toFixed(1)}`);
      // Dashoffset: lineair maar modulo L, zo afgesteld dat hij exact een
      // geheel aantal keren rond gaat per loop.
      const cyclesPerLoop = 2 + (letter.index % 3);
      const offset = -((t / T) * cyclesPerLoop * L) % L;
      letter.strokePath.setAttribute('stroke-dashoffset', offset.toFixed(2));
      letter.strokePath.setAttribute('filter', 'url(#raven-wobble)');
    },
    filterUpdate: (t) => {
      // Filter scale en frequency ook harmonisch — integer veelvouden van w
      const T = 4;
      const w = (2 * Math.PI) / T;
      const scale = (3 + Math.sin(w * 9 * t) * 1.5 + Math.sin(w * 20 * t) * 0.8) * SCALE;
      dispEl.setAttribute('scale', scale.toFixed(2));
      const freq = 0.005 + Math.sin(w * 3 * t) * 0.002;
      turbEl.setAttribute('baseFrequency', freq.toFixed(4));
    },
  },
};

// ============================================================
// Render loop
// ============================================================
let currentMood = 'chillen';
let moodStartTime = performance.now();

function frame(now) {
  const t = (now - moodStartTime) / 1000;
  const mood = moods[currentMood];

  for (const letter of letterEls) {
    const { groupTy, strokeRot, strokeTx, strokeTy, strokeSkew } = mood.transform(letter, t);
    letter.group.setAttribute('transform', `translate(0 ${groupTy})`);
    const skewPart = strokeSkew ? ` skewX(${strokeSkew})` : '';
    const expressionTransform =
      `translate(${letter.cx} ${letter.cy}) rotate(${strokeRot})${skewPart} translate(${-letter.cx + strokeTx} ${-letter.cy + strokeTy})`;
    letter.strokeWrap.setAttribute('transform', expressionTransform);
    letter.bgShape.setAttribute('transform', expressionTransform);
  }

  if (mood.filterUpdate) mood.filterUpdate(t);
  for (const letter of letterEls) {
    if (mood.stroke) mood.stroke(letter, t);
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ============================================================
// Mood switching
// ============================================================
document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    resetStroke();
    currentMood = btn.dataset.mood;
    document.body.dataset.mood = currentMood;
    moodStartTime = performance.now();
  });
});

// ============================================================
// Theme switching (day/night) — single button toggle
// ============================================================
document.getElementById('theme-toggle').addEventListener('click', () => {
  const current = document.body.dataset.theme;
  document.body.dataset.theme = current === 'day' ? 'night' : 'day';
});
</script>
