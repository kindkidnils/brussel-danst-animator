<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brussel Danst — Animator</title>
<style>
  :root {
    --bg: #350358;
    --ink: #FEE6FF;
    --accent: #FED638;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 28px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  header .credit { opacity: 0.55; }
  header .title { font-weight: 700; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    gap: 36px;
  }

  /* Stage: nu 2:1 omdat logo 290x146 is. Geen achtergrondkleur — paginakleur schijnt door. */
  .stage {
    width: min(720px, 92vw);
    aspect-ratio: 290 / 146;
  }
  .stage svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .mood-picker {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
  }
  .mood-btn {
    background: none;
    border: none;
    color: var(--ink);
    font-family: inherit;
    font-size: clamp(15px, 2.2vw, 20px);
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor: pointer;
    padding: 4px 0;
    position: relative;
    opacity: 0.4;
    transition: opacity 0.2s;
  }
  .mood-btn:hover { opacity: 0.75; }
  .mood-btn.active { opacity: 1; }
  .mood-btn.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -6px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
  }

  footer {
    display: flex;
    justify-content: center;
    padding: 28px 20px;
  }
  .export-btn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 14px 28px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .export-btn:hover:not(:disabled) { background: var(--accent); }
  .export-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  @media (max-width: 480px) {
    main { gap: 24px; padding: 12px; }
    .mood-picker { gap: 20px; }
    header { padding: 14px 16px; font-size: 11px; }
  }
</style>
</head>

<script>
// ============================================================
// Letters + path lengths
// cx/cy zijn aangepast aan de nieuwe viewBox (290x146)
// ============================================================
const letters = [
  { id: 'letter-D', cx: 45,  cy: 91,  index: 0 },
  { id: 'letter-A', cx: 97,  cy: 105, index: 1 },
  { id: 'letter-N', cx: 153, cy: 103, index: 2 },
  { id: 'letter-S', cx: 207, cy: 103, index: 3 },
  { id: 'letter-T', cx: 254, cy: 92,  index: 4 },
];

const letterEls = letters.map(l => {
  const group = document.getElementById(l.id);
  const strokeWrap = group.querySelector('.stroke-wrap');
  const strokePath = group.querySelector('.stroke-path');
  const bgShape = group.querySelector('.letter-bg');
  const pathLength = strokePath.getTotalLength();
  return { ...l, group, strokeWrap, strokePath, bgShape, pathLength };
});

const turbEl = document.getElementById('zinneke-turb');
const dispEl = document.getElementById('zinneke-disp');

// Base stroke-width: in nieuwe SVG is dit 3 (was 4.28). Belangrijk voor mood-formules.
const BASE_STROKE_WIDTH = 3;

function resetStroke() {
  for (const l of letterEls) {
    l.strokePath.removeAttribute('stroke-dasharray');
    l.strokePath.removeAttribute('stroke-dashoffset');
    l.strokePath.style.strokeWidth = '';
    l.strokePath.removeAttribute('filter');
  }
  dispEl.setAttribute('scale', '0');
}

// ============================================================
// Moods — transforms zijn iets verlaagd in amplitude omdat de
// nieuwe viewBox (290x146) veel kleiner is dan de oude (708x708).
// Vroeger 6px op 708 = 0.85% van breedte. Nu houden we ~zelfde
// percentages aan: 6px op oud → ~2.5px op nieuw.
//
// Schaalfactor ≈ 290/708 ≈ 0.41
// ============================================================
const SCALE = 0.41;

const moods = {
  zwanze: {
    transform: (letter, t) => {
      const phase = letter.index * 0.35;
      return {
        groupTy: Math.sin(t * 1.2 + phase) * 6 * SCALE,
        strokeRot: Math.sin(t * 1.0 + phase * 1.3) * 1.8,
        strokeTx: Math.sin(t * 0.9 + phase) * 1.5 * SCALE,
        strokeTy: Math.cos(t * 1.1 + phase) * 1.5 * SCALE,
        strokeSkew: 0,
      };
    },
    stroke: (letter, t) => {
      const L = letter.pathLength;
      const dashOn = L * 0.18;
      const dashOff = L * 0.05;
      const offset = -(t * 8 + letter.index * 7);
      letter.strokePath.setAttribute('stroke-dasharray', `${dashOn} ${dashOff}`);
      letter.strokePath.setAttribute('stroke-dashoffset', offset.toFixed(2));
    },
  },

  guinguette: {
    transform: (letter, t) => {
      const bpm = 90;
      const beat = (t * bpm / 60) % 3;
      const beatEnv = Math.max(0, Math.sin(beat * Math.PI / 3)) * (beat < 1 ? 1.2 : 0.6);
      const phase = letter.index * 0.25;
      return {
        groupTy: -beatEnv * 10 * SCALE + Math.sin(t * 2.0 + phase) * 2 * SCALE,
        strokeRot: Math.sin(t * 1.8 + phase) * 4.5,
        strokeTx: Math.sin(t * 1.5 + phase) * 2.5 * SCALE,
        strokeTy: 0,
        strokeSkew: 0,
      };
    },
    stroke: (letter, t) => {
      const bpm = 90;
      const beat = (t * bpm / 60) % 3;
      const beatEnv = Math.max(0, Math.sin(beat * Math.PI / 3)) * (beat < 1 ? 1.2 : 0.6);
      // Width: relatieve verandering vergelijkbaar met oude versie (4.28→6.08 = ~+42%)
      const width = BASE_STROKE_WIDTH * (1 + beatEnv * 0.42);
      letter.strokePath.style.strokeWidth = width.toFixed(2) + 'px';
    },
  },

  bal: {
    transform: (letter, t) => {
      const bpm = 124;
      const beat = (t * bpm / 60) % 1;
      const env = Math.pow(1 - beat, 3);
      const phase = letter.index * 0.04;
      return {
        groupTy: -env * 22 * SCALE + Math.sin((t + phase) * 6.5) * 1.5 * SCALE,
        strokeRot: Math.sin(t * 8 + letter.index * 1.2) * 3 * (0.3 + env),
        strokeTx: Math.sin(t * 7 + letter.index) * 3 * SCALE,
        strokeTy: env * -4 * SCALE,
        strokeSkew: 0,
      };
    },
    stroke: (letter, t) => {
      const bpm = 124;
      const beat = (t * bpm / 60) % 1;
      const env = Math.pow(1 - beat, 3);
      // Width punch: tot ~+82%
      const width = BASE_STROKE_WIDTH * (1 + env * 0.82);
      letter.strokePath.style.strokeWidth = width.toFixed(2) + 'px';
      const L = letter.pathLength;
      if (env > 0.3) {
        const dashOn = L * (0.05 + env * 0.1);
        const dashOff = L * 0.02 * env;
        letter.strokePath.setAttribute('stroke-dasharray', `${dashOn} ${dashOff}`);
        letter.strokePath.setAttribute('stroke-dashoffset', '0');
      } else {
        letter.strokePath.removeAttribute('stroke-dasharray');
      }
    },
  },

  zinneke: {
    transform: (letter, t) => {
      const f1 = 6.2 + letter.index * 1.7;
      const f2 = 9.1 - letter.index * 0.9;
      const f3 = 13.3 + letter.index * 0.6;
      return {
        groupTy: (Math.sin(t * f1) * 7 + Math.sin(t * f2 * 0.7) * 4) * SCALE,
        strokeRot: Math.sin(t * f2) * 9 + Math.sin(t * f3 * 0.5) * 4,
        strokeTx: (Math.sin(t * f1 * 1.1) * 5 + Math.cos(t * f3) * 3) * SCALE,
        strokeTy: Math.cos(t * f2 * 1.3) * 5 * SCALE,
        strokeSkew: Math.sin(t * f1 * 0.8) * 4,
      };
    },
    stroke: (letter, t) => {
      const L = letter.pathLength;
      const a = 6 + Math.abs(Math.sin(t * 3 + letter.index)) * 20;
      const b = 4 + Math.abs(Math.cos(t * 4.5 + letter.index * 1.7)) * 12;
      const c = 10 + Math.abs(Math.sin(t * 2.7 + letter.index * 0.8)) * 8;
      letter.strokePath.setAttribute('stroke-dasharray', `${a.toFixed(1)} ${b.toFixed(1)} ${c.toFixed(1)} ${(b*0.7).toFixed(1)}`);
      const offset = -t * (30 + letter.index * 6);
      letter.strokePath.setAttribute('stroke-dashoffset', offset.toFixed(2));
      letter.strokePath.setAttribute('filter', 'url(#zinneke-wobble)');
    },
    filterUpdate: (t) => {
      // Filter scale schaalt mee met de logo-grootte
      const scale = (8 + Math.sin(t * 2.3) * 4 + Math.sin(t * 5.1) * 2) * SCALE;
      dispEl.setAttribute('scale', scale.toFixed(2));
      const freq = 0.025 + Math.sin(t * 0.7) * 0.01;
      turbEl.setAttribute('baseFrequency', freq.toFixed(4));
    },
  },
};

// ============================================================
// Intro draw-in (nog uitgeschakeld, code blijft)
// ============================================================
const INTRO_ENABLED = false;
const INTRO_DURATION = 0.5;
const INTRO_STAGGER = 0.06;
const INTRO_PER_LETTER = INTRO_DURATION - INTRO_STAGGER * (letters.length - 1);

function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

function applyIntro(letter, introT) {
  const start = letter.index * INTRO_STAGGER;
  const localT = (introT - start) / INTRO_PER_LETTER;
  const L = letter.pathLength;
  if (localT <= 0) {
    letter.strokePath.setAttribute('stroke-dasharray', `${L} ${L}`);
    letter.strokePath.setAttribute('stroke-dashoffset', L.toFixed(2));
    letter.strokePath.style.strokeWidth = BASE_STROKE_WIDTH + 'px';
    letter.strokePath.removeAttribute('filter');
  } else if (localT < 1) {
    const eased = easeOutCubic(localT);
    letter.strokePath.setAttribute('stroke-dasharray', `${L} ${L}`);
    letter.strokePath.setAttribute('stroke-dashoffset', (L * (1 - eased)).toFixed(2));
    letter.strokePath.style.strokeWidth = BASE_STROKE_WIDTH + 'px';
    letter.strokePath.removeAttribute('filter');
  }
}

// ============================================================
// Render loop
// ============================================================
let currentMood = 'zwanze';
let moodStartTime = performance.now();

function frame(now) {
  const t = (now - moodStartTime) / 1000;
  const mood = moods[currentMood];

  for (const letter of letterEls) {
    const { groupTy, strokeRot, strokeTx, strokeTy, strokeSkew } = mood.transform(letter, t);

    // Group: gedeelde Y-translatie
    letter.group.setAttribute('transform', `translate(0 ${groupTy})`);

    // Bg en stroke krijgen dezelfde expressie-transform (rotation/skew/translate)
    const skewPart = strokeSkew ? ` skewX(${strokeSkew})` : '';
    const expressionTransform =
      `translate(${letter.cx} ${letter.cy}) rotate(${strokeRot})${skewPart} translate(${-letter.cx + strokeTx} ${-letter.cy + strokeTy})`;

    letter.strokeWrap.setAttribute('transform', expressionTransform);
    letter.bgShape.setAttribute('transform', expressionTransform);
  }

  if (INTRO_ENABLED && t < INTRO_DURATION) {
    for (const letter of letterEls) applyIntro(letter, t);
  } else {
    if (mood.filterUpdate) mood.filterUpdate(t);
    for (const letter of letterEls) {
      if (mood.stroke) mood.stroke(letter, t);
    }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ============================================================
// Mood switching
// ============================================================
document.querySelectorAll('.mood-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    resetStroke();
    currentMood = btn.dataset.mood;
    moodStartTime = performance.now();
  });
});
</script>
